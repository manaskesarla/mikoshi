<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search - Lakeview College (demo)</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Lakeview College</h1>
<nav aria-label="Main"><a href="index.html">Home</a><a href="admissions.html">Admissions</a><a href="fees.html">Fees</a><a href="results.html">Results</a>
<form action="search.html" method="get" role="search" style="display:inline"><input type="search" name="q" aria-label="Search the site" placeholder="Search"><button type="submit">Search</button></form></nav></header>
<main>
<h2>Search</h2><p id="q"></p><ul id="hits"></ul>
<script>
var pages=[["Fee schedule","fees.html","tuition fee library deposit examination fee due date"],["Admissions","admissions.html","apply eligibility batch"],["Results","results.html","semester results published"]];
var q=(new URLSearchParams(location.search).get("q")||"").toLowerCase();
document.getElementById("q").textContent=q?"Results for: "+q:"Type a search term.";
pages.filter(function(p){return q&&(p[0]+" "+p[2]).toLowerCase().indexOf(q)>-1}).forEach(function(p){var li=document.createElement("li");var a=document.createElement("a");a.href=p[1];a.textContent=p[0];li.appendChild(a);document.getElementById("hits").appendChild(li)});
</script>
</main>
</body></html>
